# Vendored copy of pdf-extract 0.12.1 (MIT), patched for Impress's PDF
# import; see IMPRESS_CHANGES.md. Not a workspace member.
[package]
authors = ["Jeff Muizelaar <jmuizelaar@mozilla.com>"]
description = "A library to extract content from pdfs"
edition = "2018"
license = "MIT"
name = "pdf-extract"
repository = "https://github.com/jrmuizel/pdf-extract"
version = "0.12.1"

[dependencies]
adobe-cmap-parser = "0.4.1"
encoding_rs = "0.8.34"
euclid = "0.20.5"
lopdf = {version = "0.42", default-features = false, features = ["wasm_js"]}
postscript = "0.14"
type1-encoding-parser = "0.1.1"
unicode-normalization = "0.1.19"
cff-parser = "0.2.0"
log = "0.4.22"
